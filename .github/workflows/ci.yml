name: CI

on:
  push:
      branches: [main]
  pull_request:

jobs:
  firmware-build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache ESP-IDF
        id: cache-esp-idf
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/esp-idf
            ~/.espressif
          key: esp-idf-source-v1-release-v6.1-${{ runner.os }}-esp32s3

      - name: Install ESP-IDF
        if: steps.cache-esp-idf.outputs.cache-hit != 'true'
        run: |
          git clone --branch release/v6.1 --depth 1 --recursive https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          "$RUNNER_TEMP/esp-idf/install.sh" esp32s3

      - name: Build firmware
        env:
          IDF_PATH: ${{ runner.temp }}/esp-idf
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build

  host-tests:
    name: Build and run host tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install --yes gcovr

      - name: Configure host tests
        run: cmake -S tests -B build-test

      - name: Build host tests
        run: cmake --build build-test

      - name: Run tests and generate coverage
        run: cmake --build build-test --target coverage

      - name: Publish coverage summary
        if: ${{ always() && hashFiles('build-test/coverage/summary.json') != '' }}
        run: |
          line=$(jq -r '.line_percent' build-test/coverage/summary.json)
          function=$(jq -r '.function_percent' build-test/coverage/summary.json)
          branch=$(jq -r '.branch_percent' build-test/coverage/summary.json)
          {
            echo "## Host Test Coverage"
            echo
            echo "| Lines | Functions | Branches |"
            echo "| ---: | ---: | ---: |"
            echo "| ${line}% | ${function}% | ${branch}% |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: host-test-coverage
          path: build-test/coverage/
