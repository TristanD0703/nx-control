name: CI

on:
  push:
      branches: [main]
  pull_request:

jobs:
  firmware-build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache ESP-IDF
        id: cache-esp-idf
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/esp-idf
            ~/.espressif
          key: esp-idf-source-v1-release-v6.1-${{ runner.os }}-esp32s3

      - name: Install ESP-IDF
        if: steps.cache-esp-idf.outputs.cache-hit != 'true'
        run: |
          git clone --branch release/v6.1 --depth 1 --recursive https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          "$RUNNER_TEMP/esp-idf/install.sh" esp32s3

      - name: Build firmware
        env:
          IDF_PATH: ${{ runner.temp }}/esp-idf
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          if-no-files-found: error
          overwrite: true
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/nintendo_switch_controller.bin
            build/flash_args

  host-tests:
    name: Build and run host tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Configure host tests
        run: cmake -S tests -B build-test

      - name: Build host tests
        run: cmake --build build-test

      - name: Run host tests
        run: ctest --test-dir build-test --output-on-failure

  coverage:
    name: Code coverage
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install coverage tools
        run: sudo apt-get update && sudo apt-get install --yes gcovr jq

      - name: Configure coverage build
        run: cmake -S tests -B build-coverage -DENABLE_COVERAGE=ON

      - name: Run tests and generate coverage
        run: cmake --build build-coverage --target coverage

      - name: Check optional 85% line coverage target
        run: |
          line=$(jq -r '.line_percent' build-coverage/coverage/summary.json)
          if jq --exit-status '.line_percent >= 85' build-coverage/coverage/summary.json > /dev/null; then
            echo "Line coverage is ${line}%, meeting the optional 85% target."
          else
            echo "::warning title=Line coverage below target::Line coverage is ${line}%, below the optional 85% target."
          fi

      - name: Publish coverage summary
        if: ${{ always() && hashFiles('build-coverage/coverage/summary.json') != '' }}
        run: |
          line=$(jq -r '.line_percent' build-coverage/coverage/summary.json)
          function=$(jq -r '.function_percent' build-coverage/coverage/summary.json)
          branch=$(jq -r '.branch_percent' build-coverage/coverage/summary.json)
          {
            echo "## Host Test Coverage"
            echo
            echo "| Lines | Functions | Branches |"
            echo "| ---: | ---: | ---: |"
            echo "| ${line}% | ${function}% | ${branch}% |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: host-test-coverage
          path: build-coverage/coverage/
